<style>
/* Layout: cinematic editorial — a full-bleed photograph opens the site, oversized muted grotesk type, tiny uppercase labels, hairlines instead of boxes */
:root {
  color-scheme: dark;
  --bg: #0c0b0b;
  --ink: #ece7e3;
  --text: #d6d0cc;
  --muted: #8e8681;
  --line: #2a2725;
  --stone: #c9bab1;
  --win: #ece7e3;
  --ucl: #8fb8d6;
  --playoff: #d9b26a;
  --releg: #d9776a;
  --pitch: #2f3a33;
  --chalk: #ece7e3;
  --font: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  /* aliases used by the page script's markup */
  --surface: var(--bg); --sunk: #161414; --accent: var(--stone); --accent-ink: var(--bg); --accent-soft: transparent;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--stone); outline-offset: 3px; }
a { color: var(--ink); }
.label, .lg, .tab, h3.sec, .dayhead, .meta, th, .eyebrow, .r-lg, .plabels { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

/* header on inner pages */
.mast .wrap { padding-block: 18px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.wordmark { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 800; font-size: 2.1rem; line-height: .9; letter-spacing: -.045em; text-transform: uppercase; color: var(--stone); }
.clock { text-align: right; font-weight: 600; font-size: .78rem; line-height: 1.25; letter-spacing: .02em; text-transform: uppercase; color: var(--ink); }
.clock small { display: block; font-size: .64rem; color: var(--muted); letter-spacing: .06em; }

/* nav */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); transition: background .25s, border-color .25s; }
.leagues { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; }
.leagues::-webkit-scrollbar { display: none; }
.lg { flex: none; border: 0; background: none; padding: 14px 0 12px; min-height: 44px; color: var(--muted); cursor: pointer; border-bottom: 1px solid transparent; transition: color .15s; }
.lg:hover { color: var(--ink); }
.lg[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tabs { display: flex; gap: 18px; padding-block: 2px 12px; flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 8px 0; min-height: 40px; color: var(--muted); cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::before { content: "↳ "; }

/* home: nav floats over the photo, solid once you scroll */
.is-home .mast { display: none; }
.is-home .rail { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); background: transparent; border-bottom-color: transparent; }
.is-home .lg { color: rgba(236,231,227,.78); }
.is-home .lg[aria-selected="true"], .is-home .lg:hover { color: #fff; }
.is-home.scrolled .rail { background: rgba(12,11,11,.92); border-bottom-color: var(--line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

/* splash */
.splash { position: relative; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; color: #fff; background: var(--bg); }
.splash-bg { position: absolute; inset: calc(118px + env(safe-area-inset-top, 0px)) 0 0 0; background-image: url("hero-sm.jpg"); background-size: cover; background-position: 67% 40%; filter: grayscale(.45) brightness(.5) contrast(1.08); transform: scale(1.04); }
@media (min-width: 700px) { .splash-bg { inset: 0; background-image: url("hero.jpg"); background-position: 50% 35%; } }
.splash::after { content: ""; position: absolute; inset: calc(118px + env(safe-area-inset-top, 0px)) 0 0 0; background: linear-gradient(180deg, rgba(12,11,11,1) 0%, rgba(12,11,11,0) 18%, rgba(12,11,11,0) 60%, rgba(12,11,11,.85) 100%); }
@media (min-width: 700px) { .splash::after { inset: 0; background: linear-gradient(180deg, rgba(12,11,11,.6) 0%, rgba(12,11,11,0) 30%, rgba(12,11,11,0) 60%, rgba(12,11,11,.85) 100%); } }
.splash-in { position: relative; z-index: 1; max-width: 1240px; width: 100%; margin: 0 auto; padding: calc(58px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-content: start; gap: 18px; }
.giant { margin: 0; font-weight: 800; font-size: clamp(2rem, 9.6vw, 6.4rem); line-height: .9; letter-spacing: -.05em; text-transform: uppercase; color: rgba(214,198,189,.9); }
.giant-sub { display: flex; justify-content: space-between; max-width: 100%; margin-top: 12px; font-size: .78rem; font-weight: 500; letter-spacing: .04em; color: rgba(236,231,227,.7); }
.splash .clock { color: #fff; padding-top: 6px; }
.splash .clock small { color: rgba(236,231,227,.7); }
.splash-low { position: relative; z-index: 1; max-width: 1240px; width: 100%; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 34px; }
.giant .ten { display: inline; }
@media (min-width: 700px) { .giant .ten { display: block; } }
.splash-mid { position: absolute; left: 0; right: 0; top: 24svh; z-index: 1; max-width: 1240px; width: 100%; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: flex-start; justify-content: flex-end; }
.splash-x { margin: 0; max-width: 44%; font-size: .92rem; font-weight: 500; line-height: 1.35; color: #fff; text-shadow: 0 1px 12px rgba(0,0,0,.55); }
@media (max-width: 699px) { .splash-mid { padding-right: max(10px, env(safe-area-inset-right, 0px)); } .splash-x { max-width: 38%; font-size: .86rem; } }
@media (min-width: 700px) { .splash-x { max-width: 26ch; font-size: 1rem; } }
.splash-foot { display: flex; justify-content: space-between; gap: 12px; font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(236,231,227,.8); }
.splash-foot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; }
.scroll-cue { justify-self: center; display: grid; place-items: center; width: 56px; height: 76px; border: 0; background: none; padding: 0; cursor: pointer; transition: opacity .3s; }
.cue-track { position: relative; display: block; width: 1px; height: 64px; background: rgba(236,231,227,.28); overflow: hidden; }
.cue-dot { position: absolute; left: 0; top: -24px; width: 1px; height: 24px; background: #fff; animation: cue-run 2.1s cubic-bezier(.6,0,.4,1) infinite; }
@keyframes cue-run { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(88px); opacity: 0; } }
.scrolled .scroll-cue { opacity: 0; }

main .wrap { padding-block: 26px 72px; display: grid; gap: 40px; }
.is-home main .wrap { padding-top: 56px; gap: 64px; }

.strap { display: grid; gap: 6px; }
.strap h2 { margin: 0; font-weight: 800; font-size: clamp(2.6rem, 11vw, 4.4rem); line-height: .86; letter-spacing: -.05em; text-transform: uppercase; color: var(--stone); text-wrap: balance; }
.strap p { margin: 0; color: var(--muted); }
.strap b { color: var(--ink); font-weight: 600; }

h3.sec { margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); color: var(--ink); }

/* scores */
.day { display: grid; }
.day + .day { margin-top: 22px; }
.dayhead { color: var(--muted); padding-bottom: 6px; }
.match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.team { min-width: 0; overflow-wrap: anywhere; font-weight: 500; font-size: 1.02rem; line-height: 1.2; color: var(--text); }
.team.home { text-align: right; }
.team.win { color: var(--ink); font-weight: 700; }
.team.loss { color: var(--muted); }
.score { font-weight: 700; font-size: 1.5rem; line-height: 1; letter-spacing: -.02em; color: var(--ink); white-space: nowrap; text-align: center; min-width: 3.6em; font-variant-numeric: tabular-nums; }
.score.live { color: var(--releg); }
.live-tag { display: block; font-size: .6rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; }
.score.ko { font-size: .82rem; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.probs { grid-column: 1 / -1; display: grid; gap: 6px; }
.bar { display: flex; height: 2px; background: var(--line); }
.bar i { display: block; height: 100%; }
.bar .h { background: var(--ink); }
.bar .d { background: var(--muted); opacity: .5; }
.bar .a { background: var(--stone); opacity: .6; }
.plabels { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }

/* table */
.tablebox { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 420px; font-variant-numeric: tabular-nums; }
th, td { padding: 11px 6px; text-align: right; white-space: nowrap; }
th { color: var(--muted); border-bottom: 1px solid var(--ink); }
td { border-bottom: 1px solid var(--line); font-size: .95rem; color: var(--text); }
td.club, th.club { text-align: left; width: 100%; white-space: normal; }
td.club { font-weight: 600; color: var(--ink); }
td.pos { position: relative; padding-left: 14px; color: var(--muted); }
td.pos::before { content: ""; position: absolute; left: 0; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: transparent; }
tr.z-ucl td.pos::before { background: var(--ucl); }
tr.z-po td.pos::before { background: var(--playoff); }
tr.z-rel td.pos::before { background: var(--releg); }
td.pts { font-weight: 700; color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .8rem; color: var(--muted); margin-top: 12px; }
.legend span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.legend .l-ucl::before { background: var(--ucl); }
.legend .l-po::before { background: var(--playoff); }
.legend .l-rel::before { background: var(--releg); }

/* transfers */
.deals { list-style: none; margin: 0; padding: 0; }
.deal { display: grid; grid-template-columns: 2em 1fr auto; gap: 4px 12px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--line); }
.deal .n { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.deal .who { min-width: 0; }
.deal .who b { font-weight: 700; color: var(--ink); }
.deal .route { display: block; color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }
.deal .fee { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.note { font-size: .84rem; color: var(--muted); margin: 12px 0 0; }
.window { font-size: .92rem; color: var(--text); border-left: 1px solid var(--stone); padding: 2px 0 2px 14px; }

/* posts */
.feed { display: grid; gap: 0; }
.post { display: grid; gap: 12px; padding: 26px 0 30px; border-bottom: 1px solid var(--line); }
.post:first-child { padding-top: 6px; }
.post.has-pitch { grid-template-columns: minmax(0, 1fr) 130px; column-gap: 24px; }
.post.has-pitch .pitchwrap { grid-row: 1 / span 3; grid-column: 2; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--muted); }
.chip { border: 0; padding: 0; }
.chip.kind { color: var(--stone); }
.post h4 { margin: 0; font-weight: 800; font-size: clamp(1.9rem, 7vw, 2.8rem); line-height: .95; letter-spacing: -.04em; text-transform: uppercase; color: var(--ink); text-wrap: balance; min-width: 0; }
.body { min-width: 0; max-width: 64ch; font-size: 1.04rem; line-height: 1.7; color: var(--text); }
.body p { margin: 0 0 1em; }
.body p:last-child { margin-bottom: 0; }
.pitchwrap { display: grid; gap: 6px; justify-items: center; }
.pitchwrap svg { width: 100%; max-width: 130px; height: auto; display: block; }
.pitchwrap figcaption { font-size: .78rem; color: var(--muted); }
.post .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.empty { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 26px 0; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-weight: 700; margin-bottom: 4px; }

/* home sections */
.latest { display: grid; gap: 14px; }
.latest-h { margin: 0; font-weight: 800; font-size: clamp(2.2rem, 9vw, 3.6rem); line-height: .9; letter-spacing: -.05em; text-transform: uppercase; color: var(--ink); text-wrap: balance; max-width: 18ch; }
.hero-x { margin: 0; max-width: 56ch; font-size: 1.05rem; color: var(--text); }
.eyebrow { color: var(--stone); }
.cta { justify-self: start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--ink); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; cursor: pointer; border-bottom: 1px solid var(--ink); }
.cta::before { content: "↳"; }
.cta:hover { color: var(--stone); border-bottom-color: var(--stone); }
.rows { display: grid; border-top: 1px solid var(--line); }
.row-btn { display: grid; grid-template-columns: 6.4em minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px 0; min-height: 56px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--text); text-align: left; cursor: pointer; }
.row-btn:hover .r-main { color: var(--stone); }
.r-lg { color: var(--muted); }
.r-main { min-width: 0; font-weight: 700; font-size: 1.15rem; line-height: 1.15; letter-spacing: -.01em; color: var(--ink); overflow-wrap: anywhere; transition: color .15s; }
.r-main small { display: block; font-weight: 400; font-size: .85rem; letter-spacing: 0; color: var(--muted); margin-top: 3px; }
.r-pts { font-weight: 800; font-size: 1.6rem; letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
.r-go { color: var(--muted); }
.stack { display: grid; gap: 4px; }
.follow { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 20px; }
.follow p { margin: 0; font-weight: 800; font-size: clamp(1.6rem, 6vw, 2.4rem); line-height: .95; letter-spacing: -.04em; text-transform: uppercase; color: var(--stone); }

.will-reveal .reveal { opacity: 0; transform: translateY(40px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1); }
.will-reveal .reveal.in { opacity: 1; transform: none; }

/* article page */
.story { display: grid; gap: 16px; }
.back { justify-self: start; border: 0; background: none; padding: 8px 0; min-height: 40px; color: var(--muted); cursor: pointer; font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.back:hover { color: var(--ink); }
.story-h { margin: 0; font-weight: 800; font-size: clamp(2.4rem, 10vw, 4.6rem); line-height: .88; letter-spacing: -.05em; text-transform: uppercase; color: var(--ink); text-wrap: balance; }
.story-pitch { margin: 6px 0 0; justify-items: start; }
.story-body { font-size: 1.1rem; line-height: 1.75; padding-top: 8px; }
.share { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); margin-top: 8px; }
.share-url { flex: 1 1 100%; min-width: 0; background: var(--sunk); border: 1px solid var(--line); color: var(--ink); padding: 10px 12px; border-radius: 2px; }
.title-link { color: inherit; text-decoration: none; }
.title-link:hover { color: var(--stone); }
a.row-btn { text-decoration: none; }
a.row-btn:hover .r-main { color: var(--stone); }
footer a { color: var(--text); }

/* about page */
.about { display: grid; gap: 22px; }
.about-name { margin: 0; font-weight: 800; font-size: clamp(2.8rem, 12vw, 5.6rem); line-height: .86; letter-spacing: -.055em; text-transform: uppercase; color: var(--stone); }
.about-photos { display: grid; grid-template-columns: 3fr 2fr; gap: 10px; align-items: stretch; }
.ph-col { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; min-width: 0; }
.ph-wide img { aspect-ratio: 4 / 3; object-position: 60% 50%; }
.ph-fill { min-height: 0; }
.ph-fill img { height: 100%; aspect-ratio: auto; object-position: 50% 45%; }
.ph { margin: 0; overflow: hidden; background: var(--sunk); }
.ph img { display: block; width: 100%; height: auto; max-width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
.ph-main img { aspect-ratio: 2 / 3; object-position: 50% 30%; }
.facts dd a { color: var(--ink); overflow-wrap: anywhere; }
.about-cta { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); border-top: 1px solid var(--line); }
.facts div { padding: 12px 0; border-bottom: 1px solid var(--line); }
.facts dt { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 4px 0 0; font-weight: 600; color: var(--ink); }
.about-body { font-size: 1.08rem; }
.status { font-size: .9rem; color: var(--muted); min-height: 1.3em; }
.status.err { color: var(--releg); }

footer .wrap { padding-block: 22px 44px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; display: grid; gap: 4px; }
footer #stamp { color: var(--text); }

@media (max-width: 560px) {
  .post.has-pitch { grid-template-columns: 1fr; }
  .post.has-pitch .pitchwrap { grid-row: auto; grid-column: auto; justify-items: start; }
  .match { gap: 10px; }
  .team { font-size: .95rem; }
  .score { font-size: 1.3rem; min-width: 3.2em; }
  .splash-in { grid-template-columns: 1fr; }
  .splash .clock { text-align: left; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }

<body>

<header class="mast">
  <div class="wrap">
    <button class="wordmark" data-league="home" aria-label="futanalyst10 home">Futanalyst10</button>
  </div>
</header>

<nav class="rail" aria-label="Leagues and sections">
  <div class="wrap">
    <div class="leagues" role="tablist" id="leagues"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</nav>

<div id="splash"></div>

<main>
  <div class="wrap" id="view">
    <div class="empty"><strong>Loading the matchday</strong>Scores, tables and transfers appear here in a moment.</div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>Scores and tables via SportRadar. Win probabilities are pre-match model estimates. Transfer fees in £m as reported.</span>
    <span>Analysis by <a href="#about">Juan Pablo Baquero</a></span>
    <span id="stamp">Loading…</span>
  </div>
</footer>

<script>
(function () {
  "use strict";
  var LEAGUES = ["epl", "la-liga", "serie-a", "bundesliga", "ligue-1"];
  var SECTIONS = [["scores", "Scores"], ["table", "Table"], ["transfers", "Transfers"], ["analysis", "Analysis"]];
  var data = null, posts = [], league = "home", section = "scores", article = null;
  var canPost = false, artifactNs = null, saving = false, confirmId = null;
  var draft = { kind: "analysis", league: "epl", title: "", formation: "", body: "" };

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function $(id) { return document.getElementById(id); }

      '<dl class="facts">' +
      '<div><dt>School</dt><dd>Monomoy Regional High School</dd></div>' +
      '<div><dt>Plays</dt><dd>Monomoy soccer · No. 6 · Captain</dd></div>' +
      '<div><dt>Writes</dt><dd>Decrypting Fútbol</dd></div>' +
      '<div><dt>Instagram</dt><dd><a href="' + IG + '" target="_blank" rel="noopener">@juanp_baquero</a></dd></div>' +
      '<div><dt>Email</dt><dd><a href="mailto:' + EMAIL + '">' + EMAIL + '</a></dd></div></dl>' +
      '<div class="body about-body"><p>I\'m Juan Pablo Baquero, a student at Monomoy Regional High School, where I wear the number 6 and captain the soccer team.</p>' +
      '<p>Futanalyst10 is where I write about the world\'s game: tactics, transfers and the stories behind Europe\'s top five leagues. Decrypting Fútbol is my series of breakdowns, and the scores and tables here update every day.</p>' +
      '<p>For questions or collaborations, message me on Instagram or send me an email.</p></div>' +
      '<div class="about-cta"><a class="cta" href="' + IG + '" target="_blank" rel="noopener">Instagram</a><a class="cta" href="mailto:' + EMAIL + '">Email me</a></div></section>';
  }

  /* ---------- splash parallax ---------- */
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches), ticking = false;
  function onSplashScroll() {
    ticking = false;
    var sp = document.querySelector(".splash");
    if (!sp) return;
    var y = window.scrollY, h = sp.offsetHeight || 1, k = Math.min(1, y / (h * 0.7));
    var bg = sp.querySelector(".splash-bg"), inn = sp.querySelectorAll(".splash-in, .splash-mid, .splash-low");
    inn.forEach(function (el) { el.style.opacity = (1 - k).toFixed(3); });
  }
  if (!reduceMotion) window.addEventListener("scroll", function () { if (!ticking) { ticking = true; requestAnimationFrame(onSplashScroll); } }, { passive: true });

  function render() {
    renderRail();
    if (!data) return;
    var p = article ? findPost(article) : null;
    if (article && !p) { article = null; league = "home"; }
    document.body.classList.toggle("is-home", league === "home" && !p);
    if (p) { $("splash").innerHTML = ""; document.title = p.title + " · futanalyst10"; $("view").innerHTML = viewArticle(p); return; }
    if (league === "about") { $("splash").innerHTML = ""; document.title = "About · futanalyst10"; $("view").innerHTML = viewAbout(); return; }
    document.title = "futanalyst10";
    if (league === "home") { $("splash").innerHTML = splashHTML(); $("view").innerHTML = viewHome(); armReveals(); updateClock(); return; }
    $("splash").innerHTML = "";
    updateClock();
    var L = data.leagues[league];
    var body = strap(L);
    if (section === "scores") body += viewScores(L);
    else if (section === "table") body += viewTable(L);
    else if (section === "transfers") body += viewTransfers(L);
    else body += viewAnalysis(L);
    $("view").innerHTML = body;
    var f = $("composer");
    if (f) wireComposer(f);
  }

  function wireComposer(f) {
    function sync() {
      draft.league = $("f-league").value;
      draft.title = $("f-title").value;
      draft.body = $("f-body").value;
      if ($("f-formation")) { draft.formation = $("f-formation").value; $("f-preview").innerHTML = pitchSVG(draft.formation); }
      try { sessionStorage.setItem("fa10-draft", JSON.stringify(draft)); } catch (e) {}
    }
    f.addEventListener("input", sync);
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      sync();
      var kind = f.getAttribute("data-kind"), st = $("f-status");
      st.className = "status err";
      if (!draft.title.trim()) { st.textContent = "Add a headline before publishing."; $("f-title").focus(); return; }
      if (!draft.body.trim()) { st.textContent = "Write the analysis before publishing."; $("f-body").focus(); return; }
      if (kind === "analysis" && draft.formation.trim() && !parseFormation(draft.formation)) { st.textContent = "Formation should add up to 10 outfield players, like 4-3-3 or 3-4-2-1."; $("f-formation").focus(); return; }
      var post = {
        id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        kind: kind, league: draft.league, title: draft.title.trim(),
        formation: kind === "analysis" ? draft.formation.trim() : "",
        body: draft.body.trim(), date: new Date().toISOString()
      };
      save(posts.concat([post]), "Published", function () {
        draft = { kind: kind, league: draft.league, title: "", formation: "", body: "" };
        try { sessionStorage.removeItem("fa10-draft"); } catch (e) {}
      });
    });
  }

  function setStatus(msg, isErr) {
    var st = $("f-status");
    if (st) { st.textContent = msg; st.className = "status" + (isErr ? " err" : ""); }
    else if (isErr) { $("stamp").textContent = msg; }
  }

  function save(next, okMsg, onOk) {
    if (!artifactNs || saving) return;
    saving = true;
    var btn = $("f-submit"); if (btn) btn.disabled = true;
    setStatus("Saving…", false);
    artifactNs.publish({ "posts.json": JSON.stringify({ posts: next }, null, 1) }).then(function () {
      saving = false; posts = next; confirmId = null;
      if (onOk) onOk();
      render();
      setStatus(okMsg, false);
    }).catch(function (err) {
      saving = false;
      var code = err && err.code;
      var msg = "Couldn't save. Check your connection and try again.";
      if (code === "conflict") msg = "Someone saved at the same moment. The page is reloading with the latest version.";
      else if (code === "capability_disabled") msg = "Posting is unavailable here.";
      else if (code === "not_writer" || code === "not_granted") msg = "Only the owner can post here.";
      render();
      setStatus(msg, true);
    });
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.copy) {
      var url = $("share-url"), st = $("share-status"), link = url ? url.value : location.href;
      function fallback() { if (url) { url.hidden = false; url.focus(); url.select(); } if (st) st.textContent = "Copy the link above."; }
      try {
        navigator.clipboard.writeText(link).then(function () { if (st) st.textContent = "Link copied"; }, fallback);
      } catch (err) { fallback(); }
      return;
    }
    if (t.dataset.league) { article = null; league = t.dataset.league; if (location.hash !== "#" + league) location.hash = league; render(); return; }
    if (t.dataset.scroll) { var sp = document.querySelector(".splash"); if (sp) window.scrollTo({ top: sp.offsetHeight - 60, behavior: reduceMotion ? "auto" : "smooth" }); return; }
    if (t.dataset.goto) {
      var parts = t.dataset.goto.split("|");
      article = null; league = parts[0]; section = parts[1] || "scores"; store("fa10-section", section);
      if (location.hash !== "#" + league) location.hash = league;
      render(); window.scrollTo(0, 0); return;
    }
    if (t.dataset.section) { section = t.dataset.section; store("fa10-section", section); render(); return; }
    if (t.dataset.ask) { confirmId = t.dataset.ask; render(); return; }
    if (t.dataset.cancel) { confirmId = null; render(); return; }
    if (t.dataset.del) {
      var id = t.dataset.del;
      save(posts.filter(function (p) { return p.id !== id; }), "Deleted");
    }
  });
  window.addEventListener("hashchange", function () { fromHash(); render(); if (article || league === "about") window.scrollTo(0, 0); });

  /* ---------- boot ---------- */
  fromHash();
  var savedSection = store("fa10-section");
  if (savedSection && SECTIONS.some(function (s) { return s[0] === savedSection; })) section = savedSection;
  try { var dr = JSON.parse(sessionStorage.getItem("fa10-draft") || "null"); if (dr) draft = dr; } catch (e) {}
  draft.league = LEAGUES.indexOf(league) >= 0 ? league : "epl";
  renderRail();

  function getJSON(path) { return fetch(path, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(path); return r.json(); }); }
  var LIVE_URL = "https://futanalyst-data.juanpablobrey.workers.dev/";
  function getLive() {
    var ctl = ("AbortController" in window) ? new AbortController() : null, timer = setTimeout(function () { if (ctl) ctl.abort(); }, 7000);
    return fetch(LIVE_URL, { cache: "no-store", signal: ctl ? ctl.signal : undefined }).then(function (r) {
      clearTimeout(timer); if (!r.ok) throw new Error("live " + r.status); return r.json();
    }).catch(function () { clearTimeout(timer); return null; });
  }
  function mergeLive(base, live) {
    if (!live || !live.leagues) return false;
    var ok = false;
    LEAGUES.forEach(function (id) {
      var L = live.leagues[id];
      if (L && L.table && L.table.length && base.leagues[id]) { base.leagues[id].table = L.table; base.leagues[id].games = L.games || []; ok = true; }
    });
    if (ok) base.updated = live.updated;
    return ok;
  }
  function setStamp() { $("stamp").textContent = "Updated " + fmtStamp.format(new Date(data.updated)); }
  setInterval(function () {
    if (!data || document.hidden || $("composer")) return;
    getLive().then(function (live) { if (mergeLive(data, live)) { setStamp(); if (!article && league !== "about") render(); } });
  }, 300000);
  Promise.all([getJSON("data.json"), getJSON("posts.json").catch(function () { return { posts: [] }; }), getLive()]).then(function (res) {
    data = res[0]; posts = (res[1] && res[1].posts) || [];
    mergeLive(data, res[2]);
    LEAGUES.forEach(function (id) { if (data.leagues[id]) data.leagues[id]._id = id; });
    assignSlugs();
    setStamp();
    render();
  }).catch(function () {
    $("stamp").textContent = "Data unavailable";
    $("view").innerHTML = '<div class="empty"><strong>The match data didn\'t load</strong>Refresh the page to try again.</div>';
  });

})();
</script>
